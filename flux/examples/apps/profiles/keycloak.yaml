---
# AppProfile for the catalog's keycloak component
# (stuttgart-things/flux apps/platform/components/keycloak). Moves into the
# catalog once the format has held up, see blueprints#206.
kind: AppProfile
metadata:
  name: keycloak
spec:
  bundle: apps-platform
  component: ../components/keycloak
  vars:
    # The base has no default; a PVC that never binds crash-loops Keycloak.
    KEYCLOAK_STORAGE_CLASS: { required: true }
    INFRA_DOMAIN: { required: true }
    KEYCLOAK_HOSTNAME: {}
    KEYCLOAK_NAMESPACE: {}
    KEYCLOAK_VERSION: {}
    KEYCLOAK_SUSPEND: {}
    APPS_CLUSTER_ISSUER: {}
    INFRA_GATEWAY_NAME: {}
    INFRA_GATEWAY_NAMESPACE: {}
  # substituteFrom-keys: ADMIN_PASSWORD, ADMIN_USER
  secrets:
    - name: keycloak-secrets
      data:
        ADMIN_USER: admin
        # alnum, not password: release.yaml substitutes it unquoted
        # (adminPassword: ${ADMIN_PASSWORD}), and a leading ! # or % would
        # turn the value into a YAML tag, comment or directive.
        ADMIN_PASSWORD: { generate: { type: alnum, length: 32 } }
