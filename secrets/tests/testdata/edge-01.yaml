---
# Cluster with Vault: platform + monitoring profiles, plus a cluster-only secret.
kind: ClusterSecrets
metadata:
  name: edge-01
spec:
  profiles: [platform, monitoring]
  secrets:
    - name: grafana-admin
      namespace: monitoring
      type: kubernetes.io/basic-auth
      data:
        username: admin
        password: { generate: { type: hex, length: 40 } }
