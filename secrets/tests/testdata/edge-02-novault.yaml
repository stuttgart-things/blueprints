---
# Edge cluster without Vault: everything comes from generate/sops.
kind: ClusterSecrets
metadata:
  name: edge-02
spec:
  profiles: [platform]
  secrets:
    - name: velero-secrets
      namespace: velero
      data:
        AWS_SECRET_ACCESS_KEY: ref+sops://secrets/minio.enc.yaml#/secretKey # pragma: allowlist secret
