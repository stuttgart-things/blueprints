---
kind: SecretProfile
metadata:
  name: monitoring
spec:
  secrets:
    - name: alertmanager-secrets
      namespace: monitoring
      data:
        MSTEAMS_WEBHOOK: ref+vault://secret/edge/teams#/webhook
        LEGACY_TOKEN: ref+vault://kv1/legacy?kv=1#/token
    - name: velero-secrets
      namespace: velero
      data:
        AWS_SECRET_ACCESS_KEY: ref+vault://secret/edge/minio#/secretKey # pragma: allowlist secret
