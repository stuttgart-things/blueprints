---
kind: SecretProfile
metadata:
  name: platform
spec:
  secrets:
    - name: harbor-secrets
      data:
        HARBOR_ADMIN_PASSWORD: { generate: { type: password, length: 24 } }
        HARBOR_SECRET_KEY: { generate: { type: alnum, length: 16 } }  # harbor requires exactly 16
    - name: velero-secrets
      namespace: velero
      data:
        AWS_ACCESS_KEY_ID: ref+sops://secrets/minio.enc.yaml#/accessKey
        BUCKET: velero
